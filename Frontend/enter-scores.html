<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enter Scores | GES Academic System</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#2563eb'
          }
        }
      }
    }
  </script>
</head>

<body
  class="min-h-screen bg-cover bg-center relative"
  style="background-image: url('img/bg-login.jpg');"
>

<!-- Overlay -->
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/60 via-slate-900/50 to-blue-900/50"></div>

<div class="relative z-10 min-h-screen">

  <!-- HEADER -->
  <header class="flex items-center justify-between px-6 py-4">
    <h1 class="text-lg font-semibold text-white">📝 Enter Scores</h1>
    <a href="student-profile.html" class="text-sm text-white/80 hover:underline">
      ← Back to Profile
    </a>
  </header>

  <!-- CONTENT -->
  <main class="px-6 pb-10 space-y-6">

    <!-- STUDENT INFO -->
    <section class="glass-section">
      <h2 class="text-white font-semibold">Ama Mensah</h2>
      <p class="text-sm text-white/70">JHS 2 • English Language</p>
    </section>

    <!-- SCORE ENTRY -->
    <section class="glass-section space-y-5">

      <h3 class="section-title">Continuous Assessment (100)</h3>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <input id="test1" class="input" placeholder="Test 1" type="number" />
        <input id="test2" class="input" placeholder="Test 2" type="number" />
        <input id="groupWork" class="input" placeholder="Group Work" type="number" />
        <input id="projectWork" class="input" placeholder="Project Work" type="number" />
      </div>

      <div class="flex justify-between text-sm text-white/80 mt-2">
        <span>Class Score (50)</span>
        <strong id="classScoreDisplay">0</strong>
      </div>

    </section>

    <!-- EXAM -->
    <section class="glass-section space-y-4">
      <h3 class="section-title">Exam Score (100)</h3>

      <input
        id="examScore"
        type="number"
        class="input w-full"
        placeholder="Enter exam score"
      />

      <div class="flex justify-between text-sm text-white/80">
        <span>Converted Exam (50)</span>
        <strong id="examScoreDisplay">0</strong>
      </div>
    </section>

    <!-- FINAL -->
    <section class="glass-section">

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center text-white">

        <div>
          <p class="label">Final Score</p>
          <h3 id="finalScoreDisplay" class="value">0</h3>
        </div>

        <div>
          <p class="label">Grade</p>
          <h3 id="gradeDisplay" class="value">—</h3>
        </div>

        <div>
          <p class="label">Decision</p>
          <h3 id="decisionDisplay" class="value">—</h3>
        </div>

        <div>
          <p class="label">Position</p>
          <h3 id="positionDisplay" class="value">—</h3>
        </div>

      </div>

    </section>

    <!-- ACTIONS -->
    <section class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <button id="saveBtn" class="action-btn">💾 Save Scores</button>
      <button class="action-btn">➡️ Next Subject</button>
      <button class="action-btn">📄 Preview Report</button>
    </section>

  </main>
</div>

<!-- STYLES -->
<style>
  .glass-section {
    background: linear-gradient(to bottom right, rgba(255,255,255,.25), rgba(255,255,255,.1));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 1.25rem;
    padding: 1.5rem;
  }

  .section-title {
    color: white;
    font-size: .9rem;
    font-weight: 600;
  }

  .input {
    background: rgba(255,255,255,.85);
    padding: .6rem .75rem;
    border-radius: .5rem;
    font-size: .85rem;
    width: 100%;
  }

  .label {
    font-size: .7rem;
    opacity: .7;
  }

  .value {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .action-btn {
    background: rgba(255,255,255,.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    padding: .75rem;
    border-radius: .75rem;
    font-size: .8rem;
  }

  .action-btn:hover {
    background: rgba(255,255,255,.3);
  }
</style>
<script>
  const inputs = ['test1', 'test2', 'groupWork', 'projectWork', 'examScore'];
  const displays = {
    classScore: document.getElementById('classScoreDisplay'),
    examScore: document.getElementById('examScoreDisplay'),
    finalScore: document.getElementById('finalScoreDisplay'),
    grade: document.getElementById('gradeDisplay'),
    decision: document.getElementById('decisionDisplay')
  };

  const calculate = () => {
    const t1 = parseFloat(document.getElementById('test1').value) || 0;
    const t2 = parseFloat(document.getElementById('test2').value) || 0;
    const gw = parseFloat(document.getElementById('groupWork').value) || 0;
    const pw = parseFloat(document.getElementById('projectWork').value) || 0;
    const es = parseFloat(document.getElementById('examScore').value) || 0;

    const classScoreTotal = t1 + t2 + gw + pw;
    const convertedClass = (classScoreTotal / 100) * 50;
    const convertedExam = (es / 100) * 50;
    const finalScore = convertedClass + convertedExam;

    displays.classScore.innerText = convertedClass.toFixed(1);
    displays.examScore.innerText = convertedExam.toFixed(1);
    displays.finalScore.innerText = finalScore.toFixed(1);

    let grade = 'F';
    let decision = 'RETAINED';
    let color = 'text-red-400';

    if (finalScore >= 80) grade = 'A';
    else if (finalScore >= 70) grade = 'B';
    else if (finalScore >= 60) grade = 'C';
    else if (finalScore >= 50) grade = 'D';

    if (finalScore >= 50) {
      decision = 'PROMOTED';
      color = 'text-green-300';
    }

    displays.grade.innerText = grade;
    displays.decision.innerText = decision;
    displays.decision.className = `value ${color}`;
  };

  inputs.forEach(id => {
    document.getElementById(id).addEventListener('input', calculate);
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const payload = {
      studentId: 'placeholder-id', // This should be dynamic based on the selected student
      subjectId: 'placeholder-subject',
      test1: parseFloat(document.getElementById('test1').value) || 0,
      test2: parseFloat(document.getElementById('test2').value) || 0,
      groupWork: parseFloat(document.getElementById('groupWork').value) || 0,
      projectWork: parseFloat(document.getElementById('projectWork').value) || 0,
      examScore: parseFloat(document.getElementById('examScore').value) || 0,
    };

    try {
      const response = await fetch('http://localhost:5001/api/scores', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert('Scores saved successfully!');
      } else {
        const error = await response.json();
        alert('Error: ' + error.error);
      }
    } catch (error) {
      alert('Failed to save scores. Ensure server is running.');
    }
  });
</script>

</body>
</html>
