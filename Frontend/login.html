<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | GES Academic System</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            accent: '#2563eb',
            soft: '#f8fafc'
          }
        }
      }
    }
  </script>
</head>

<body
  class="min-h-screen flex items-center justify-center bg-cover bg-center relative" style="background-image: url('img/bg-login.jpg');"
>

<!-- ================= OVERLAY ================= -->
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/50 via-slate-900/40 to-blue-900/40"></div>

<!-- ================= LOGIN CARD ================= -->
<div class="relative w-full max-w-md mx-auto px-4">
  <div class="
  bg-white/20        
  backdrop-blur-3xl  
  backdrop-saturate-150
  border border-white/30
  ring-1 ring-white/20
  rounded-2xl
  p-8
  shadow-lg shadow-black/20
  bg-gradient-to-br from-white/30 to-white/10
">


    <!-- Header -->
    <div class="text-center mb-8">
      <div class="text-3xl mb-2">📘</div>
      <h1 class="text-xl font-semibold text-ink">
        GES Academic System
      </h1>
      <p class="mt-2 text-sm text-gray-600">
        Sign in to manage school records
      </p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-5">
      <!-- Error Message Container -->
      <div id="errorContainer" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 text-xs p-3 rounded-lg text-center animate-pulse">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          id="email"
          type="email"
          placeholder="e.g. admin@example.com"
          required
          class="
            w-full
            rounded-lg
            border border-gray-300
            bg-white/80
            px-4 py-2.5
            text-sm
            focus:outline-none
            focus:ring-2
            focus:ring-accent
          "
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <div class="relative">
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            required
            class="
              w-full
              rounded-lg
              border border-gray-300
              bg-white/80
              px-4 py-2.5
              text-sm
              focus:outline-none
              focus:ring-2
              focus:ring-accent
            "
          />
          <button
            type="button"
            id="togglePassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-accent focus:outline-none"
          >
            <span id="eyeIcon">👁️</span>
          </button>
        </div>
      </div>

      <!-- Remember / Forgot -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-600">
          <input type="checkbox" class="rounded border-gray-300">
          Remember me
        </label>

        <a href="#" class="text-accent hover:underline">
          Forgot password?
        </a>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-gray-600">
          New Here?
        </label>

        <a href="signup.html" class="text-accent hover:underline">
          Create Account
        </a>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="
          w-full
          bg-accent
          text-white
          py-3
          rounded-lg
          text-sm
          font-medium
          hover:bg-blue-700
          transition
        "
      >
        Sign In
      </button>
    </form>

    <!-- Footer -->
    <p class="mt-8 text-xs text-center text-gray-500">
      Authorized staff only • GES Basic Schools (KG–JHS)
    </p>

  </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  const errorContainer = document.getElementById('errorContainer');
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  
  // Toggle Password
  togglePassword.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    eyeIcon.innerText = type === 'password' ? '👁️' : '🙈';
  });

  const showError = (msg) => {
    errorContainer.innerText = msg;
    errorContainer.classList.remove('hidden');
    setTimeout(() => {
      errorContainer.classList.add('hidden');
    }, 5000);
  };

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
      const response = await fetch('http://localhost:5001/api/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });
      
      const data = await response.json();
      
      if (response.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        // Simple success message before redirect
        errorContainer.innerText = 'Login successful! Redirecting...';
        errorContainer.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/50', 'text-red-200');
        errorContainer.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-200');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        showError(data.error || 'Login failed');
      }
    } catch (error) {
      console.error('Error:', error);
      showError('Check your connection or if the server is running.');
    }
  });
</script>

</body>
</html>
