<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | GES Academic System</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f172a',
            accent: '#2563eb',
            soft: '#f8fafc'
          }
        }
      }
    }
  </script>
</head>

<body
  class="min-h-screen flex items-center justify-center bg-cover bg-center relative"
  style="background-image: url('img/bg-signup.jpg');"
>

<!-- ================= OVERLAY ================= -->
<div class="absolute inset-0 bg-gradient-to-br from-slate-900/50 via-slate-900/40 to-blue-900/40"></div>
<!-- ================= SIGNUP CARD ================= -->
<div class="relative w-full max-w-md mx-auto px-4">
  <div class="
    bg-white/20
    backdrop-blur-3xl
    backdrop-saturate-150
    border border-white/30
    ring-1 ring-white/20
    rounded-2xl
    p-8
    shadow-lg shadow-black/20
    bg-gradient-to-br from-white/30 to-white/10
  ">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="text-3xl mb-2">📝</div>
      <h1 class="text-xl font-semibold text-ink">
        Create Account
      </h1>
      <p class="mt-2 text-sm text-gray-300">
        Sign up to manage school records
      </p>
    </div>

    <!-- Form -->
    <form id="signupForm" class="space-y-5">
      <!-- Error Message Container -->
      <div id="errorContainer" class="hidden bg-red-500/20 border border-red-500/50 text-red-100 text-xs p-3 rounded-lg text-center animate-pulse">
      </div>

      <!-- Full Name -->
      <div>
        <label class="block text-sm font-medium text-gray-200 mb-1">
          Full Name
        </label>
        <input
          id="name"
          type="text"
          placeholder="John Doe"
          required
          class="w-full rounded-lg border border-gray-300 bg-white/80 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-200 mb-1">
          Email
        </label>
        <input
          id="email"
          type="email"
          placeholder="admin@example.com"
          required
          class="w-full rounded-lg border border-gray-300 bg-white/80 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-200 mb-1">
          Password
        </label>
        <div class="relative">
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            required
            class="w-full rounded-lg border border-gray-300 bg-white/80 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
          />
          <button
            type="button"
            onclick="togglePass('password', 'eye1')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-accent focus:outline-none"
          >
            <span id="eye1">👁️</span>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-200 mb-1">
          Confirm Password
        </label>
        <div class="relative">
          <input
            id="confirmPassword"
            type="password"
            placeholder="••••••••"
            required
            class="w-full rounded-lg border border-gray-300 bg-white/80 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
          />
          <button
            type="button"
            onclick="togglePass('confirmPassword', 'eye2')"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-accent focus:outline-none"
          >
            <span id="eye2">👁️</span>
          </button>
        </div>
      </div>

      <!-- Signup Button -->
      <button
        type="submit"
        class="w-full bg-accent text-white py-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition"
      >
        Sign Up
      </button>

      <!-- Login Link -->
      <p class="mt-4 text-center text-sm text-gray-200">
        Already have an account? 
        <a href="login.html" class="text-accent hover:underline font-medium">Login</a>
      </p>

    </form>

    <!-- Footer -->
    <p class="mt-6 text-xs text-center text-gray-400">
      Authorized staff only • GES Basic Schools (KG–JHS)
    </p>

  </div>
</div>

<script>
  const signupForm = document.getElementById('signupForm');
  const errorContainer = document.getElementById('errorContainer');

  function togglePass(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
    input.setAttribute('type', type);
    eye.innerText = type === 'password' ? '👁️' : '🙈';
  }

  const showError = (msg) => {
    errorContainer.innerText = msg;
    errorContainer.classList.remove('hidden');
    setTimeout(() => {
      errorContainer.classList.add('hidden');
    }, 5000);
  };
  
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (password !== confirmPassword) {
      showError('Passwords do not match');
      return;
    }
    
    try {
      const response = await fetch('http://localhost:5001/api/auth/signup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, email, password })
      });
      
      const data = await response.json();
      
      if (response.ok) {
        errorContainer.innerText = 'Account created! Redirecting to login...';
        errorContainer.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/50', 'text-red-100');
        errorContainer.classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-100');
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        showError(data.error || 'Signup failed');
      }
    } catch (error) {
      console.error('Error:', error);
      showError('Check your connection or if the server is running.');
    }
  });
</script>

</body>
</html>
